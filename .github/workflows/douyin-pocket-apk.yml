name: Douyin Pocket APK
on:
  push:
    branches: [codex/douyin-pocket]
    paths: ['mobile/**', '.github/workflows/douyin-pocket-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: douyin-pocket-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: mobile/android/app/douyin-pocket-debug.keystore
          key: douyin-pocket-debug-signing-${{ github.repository_id }}-v1
      - name: Create stable personal-test signing key when missing
        run: |
          if [ ! -f android/app/douyin-pocket-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/douyin-pocket-debug.keystore \
              -storepass android \
              -alias douyin-pocket-debug \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Douyin Pocket Debug, OU=Personal Testing, O=MeeNGooK, C=KR"
          fi
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        run: npm ci
      - name: Test links and media extraction
        run: npm test
      - name: Build web UI and sync Android
        run: npm run sync
      - name: Test and assemble installable APK
        run: |
          chmod +x android/gradlew
          cd android
          set -o pipefail
          if ! ./gradlew testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee ../gradle-build.log; then
            tail -n 40 ../gradle-build.log | tr '\n' ' ' | sed 's/::/: :/g' | xargs -0 -I{} echo "::error title=Android build failure::{}"
            exit 1
          fi
      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DouyinPocket-debug.apk
          cd artifacts
          sha256sum DouyinPocket-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DouyinPocket-APK
          path: mobile/artifacts/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: douyin-pocket-${{ github.run_number }}
          name: Douyin Pocket build #${{ github.run_number }}
          body: |
            Android APK for commit `${{ github.sha }}`.

            Download `DouyinPocket-debug.apk` below and install it on Android 10 or later. This is a debug-signed build for personal testing. If updating fails because the signing key changed, uninstall the previous build first.
          make_latest: true
          files: |
            mobile/artifacts/DouyinPocket-debug.apk
            mobile/artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-and-lint-reports
          path: |
            mobile/android/app/build/reports/tests/
            mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
